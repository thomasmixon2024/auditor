[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auditor"
version = "0.1.0"
description = "A lightweight auditing toolkit with HTML, JSON, and SARIF reporting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Thomas" }]

dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0"
]

[project.urls]
Homepage = "https://github.com/yourname/auditor"

[project.scripts]
auditor = "auditor.__main__:main"
